name: npm only

# Tempo opens this project for every new user and ships npm, not pnpm, yarn or
# bun. This check keeps the project installable with npm alone on the three
# platforms Tempo runs on. See "This project uses npm, on purpose" in README.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  npm-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20 carries npm 10 and Node 24 carries npm 11 (Tempo ships npm
        # 11). The two write lockfiles differently, and the committed ones
        # must satisfy both, or an install leaves the user's project changed.
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Project declares npm only
        run: node .github/scripts/check-npm-only.mjs
      - name: Install the app with npm
        run: npm ci
      - name: Install the canvas host with npm
        run: npm ci
        working-directory: tempo
      - name: Lockfiles are complete (an install changes nothing)
        shell: bash
        run: |
          npm install
          (cd tempo && npm install)
          git diff --exit-code -- package-lock.json tempo/package-lock.json
      # `npm run build` also runs `tsc -b`, which reports type errors this
      # project already had; they are not what this check is for.
      - name: App bundles
        run: npx vite build
